; Isolated MAX6675 diagnostic. Independent from firmware/ (production).
; No Wi-Fi, no LittleFS. Uses the same default partition table as production,
; so the LittleFS data partition and NVS (saved Wi-Fi) are not touched by upload.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
  robtillaart/MAX6675 @ 0.3.4
